function seed(){let m=nextMonday();let sessions=[0,1,2,3,4].map((offset,i)=>{let d=new Date(m);d.setDate(m.getDate()+offset);return {id:'s'+i,date:localDate(d),time:['17:00','18:00','17:30','19:00','18:00'][i],duration:60,capacity:10,published:true}});return {swimmers:[{id:'u1',name:'Ana (demo)',pin:'1234'},{id:'u2',name:'Carlos (demo)',pin:'5678'}],admins:[{id:'a1',name:'Administrador demo',password:'garagua-demo'}],sessions,bookings:[]}};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}let user=null,role='swimmer',tab='sessions',adminTab='classes',weekOffset=0;function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn("No se pudo guardar en este navegador",e)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateObj(s,t='00:00'){return new Date(s+'T'+t+':00')}function nice(s){return dateObj(s).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}function count(id){return db.bookings.filter(b=>b.sessionId===id).length}function booked(id){return db.bookings.some(b=>b.sessionId===id&&b.userId===user.id)}function canCancel(s){return dateObj(s.date,s.time).getTime()-Date.now()>=7200000}function startWeek(){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+weekOffset*7);return d}function weekLabel(){let d=startWeek(),e=new Date(d);e.setDate(d.getDate()+6);return `${d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${e.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}`}
function header(){return `<div class="row"><div class="row" style="gap:9px"><img src="${LOGO}" style="width:55px;height:55px;border-radius:50%"><div><strong>GARAGUA</strong><div class="small muted">Club de Natación</div></div></div><button class="secondary" onclick="logout()">Salir</button></div><div class="muted" style="margin-top:8px">Hola, ${esc(user.name)} · ${role==='admin'?'Administrador':'Nadador'}</div>`}
function render(){let app=document.getElementById('app');if(!user){app.innerHTML=`<div class="card hero"><img class="logo" src="${LOGO}"><h1 class="title">Bienvenido a Garagua</h1><p class="sub">Reserva tus entrenamientos de natación</p><div class="tabs" style="justify-content:center"><button class="${role==='swimmer'?'on':''}" data-login-role="swimmer">Nadadores</button><button class="${role==='admin'?'on':''}" data-login-role="admin">Administración</button></div><form onsubmit="login(event)" style="text-align:left;margin-top:18px"><label>Nombre</label><input id="loginname" required placeholder="Tu nombre" autocomplete="username"><label>${role==='swimmer'?'Código de 4 cifras':'Contraseña'}</label><input id="loginpass" ${role==='swimmer'?'inputmode="numeric" pattern="[0-9]{4}" maxlength="4"':''} type="password" required placeholder="${role==='swimmer'?'••••':'Contraseña'}"><button class="primary full" type="submit">Entrar</button></form><div class="notice">🧪 <strong>Versión de prueba corregida:</strong><br>${role==='swimmer'?'Ana (demo) / 1234':'Administrador demo / garagua-demo'}<br>Los datos se guardan solo en este navegador.</div></div>`;return}app.innerHTML=header()+(role==='admin'?renderAdmin():renderSwimmer())+`<p class="muted small" style="text-align:center;margin-top:25px">Garagua · Prototipo local de demostración</p>`}
document.addEventListener("click",function(e){const b=e.target.closest("[data-login-role]");if(!b)return;role=b.dataset.loginRole;render();});
function login(e){e.preventDefault();let n=document.getElementById('loginname').value.trim().toLowerCase(),p=document.getElementById('loginpass').value;let found=(role==='admin'?db.admins:db.swimmers).find(u=>u.name.toLowerCase()===n&&(role==='admin'?u.password:u.pin)===p);if(!found){alert('Nombre o código incorrecto');return}user=found;tab='sessions';render()}function logout(){user=null;render()}
function listSessions(onlyMine=false){let from=localDate(startWeek()),end=new Date(startWeek());end.setDate(end.getDate()+6);let to=localDate(end);let sessions=db.sessions.filter(s=>s.published&& (onlyMine?booked(s.id):s.date>=from&&s.date<=to)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(onlyMine)sessions=sessions.filter(s=>dateObj(s.date,s.time)>new Date());if(!sessions.length)return `<div class="card empty">${onlyMine?'Todavía no tienes reservas próximas.':'No hay entrenamientos publicados esta semana.'}</div>`;return sessions.map(s=>{let mine=booked(s.id),free=s.capacity-count(s.id),past=dateObj(s.date,s.time)<=new Date();return `<article class="session"><div class="row"><div><h3>${esc(nice(s.date))}</h3><p>🕒 ${esc(s.time)} · ${s.duration} minutos</p><p class="${free?'badge':'error'}">${free?free+' plazas libres':'Completo'} <span class="muted">· ${count(s.id)}/${s.capacity} inscritos</span></p></div><div>${mine?`<span class="pill">✓ Reservado</span><div style="height:9px"></div><button class="danger" ${canCancel(s)?'':'disabled'} onclick="cancel('${s.id}')">Cancelar</button>`:`<button class="primary" ${free<=0||past?'disabled':''} onclick="reserve('${s.id}')">Reservar</button>`}</div></div>${mine&&!canCancel(s)?'<p class="small warning">Cancelación cerrada: faltan menos de 2 horas.</p>':''}</article>`}).join('')}
function renderSwimmer(){return `<div class="tabs"><button class="${tab==='sessions'?'on':''}" onclick="tab='sessions';render()">Entrenamientos</button><button class="${tab==='mine'?'on':''}" onclick="tab='mine';render()">Mis reservas (${db.bookings.filter(b=>b.userId===user.id).length})</button></div>${tab==='mine'?`<h2 class="section-title">Mis próximas reservas</h2>${listSessions(true)}`:`<div class="card"><div class="row"><button class="secondary" onclick="weekOffset--;render()">‹</button><strong style="text-align:center">${weekLabel()}</strong><button class="secondary" onclick="weekOffset++;render()">›</button></div></div>${listSessions()}`}`}
function reserve(id){let s=db.sessions.find(x=>x.id===id);if(!s||!s.published||count(id)>=s.capacity||booked(id)||dateObj(s.date,s.time)<=new Date())return alert('Esta plaza ya no está disponible');db.bookings.push({sessionId:id,userId:user.id});save();render()}
function cancel(id){let s=db.sessions.find(x=>x.id===id);if(!s||!canCancel(s))return alert('Solo puedes cancelar hasta dos horas antes.');db.bookings=db.bookings.filter(b=>!(b.sessionId===id&&b.userId===user.id));save();render()}
function renderAdmin(){return `<div class="tabs"><button class="${adminTab==='classes'?'on':''}" onclick="adminTab='classes';render()">Horarios</button><button class="${adminTab==='swimmers'?'on':''}" onclick="adminTab='swimmers';render()">Nadadores</button><button class="${adminTab==='admins'?'on':''}" onclick="adminTab='admins';render()">Administradores</button></div>${adminTab==='classes'?adminClasses():adminTab==='swimmers'?adminSwimmers():adminAdmins()}`}
function adminClasses(){return `<div class="card"><h2>Crear entrenamiento</h2><p class="muted">Prepara los horarios y publícalos cuando quieras, normalmente el domingo.</p><form onsubmit="addSession(event)"><div class="grid"><div><label>Fecha</label><input id="sdate" type="date" required value="${localDate(nextMonday())}"></div><div><label>Hora</label><input id="stime" type="time" required value="17:00"></div><div><label>Duración (minutos)</label><input id="sduration" type="number" min="15" max="240" required value="60"></div><div><label>Plazas máximas</label><input id="scapacity" type="number" min="1" max="100" required value="10"></div></div><label class="row" style="justify-content:flex-start"><input type="checkbox" id="spublished" style="width:auto;margin:0"> Publicar inmediatamente</label><br><br><button class="primary full">Añadir entrenamiento</button></form></div><div class="row wraprow"><h2>Entrenamientos</h2><button class="primary" onclick="publishAll()">Publicar pendientes</button></div>${db.sessions.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(s=>`<article class="card"><div class="row wraprow"><div><strong>${esc(nice(s.date))} · ${esc(s.time)}</strong><p class="muted">${s.duration} min · ${count(s.id)}/${s.capacity} inscritos · ${s.published?'🟢 Publicado':'🟠 Borrador'}</p></div><div class="row wraprow"><button class="secondary" onclick="togglePublish('${s.id}')">${s.published?'Ocultar':'Publicar'}</button><button class="secondary" onclick="editSession('${s.id}')">Editar</button><button class="danger" onclick="deleteSession('${s.id}')">Eliminar</button></div></div><details><summary>Ver inscritos (${count(s.id)})</summary><p class="small">${db.bookings.filter(b=>b.sessionId===s.id).map(b=>{let u=db.swimmers.find(u=>u.id===b.userId);return u?`${esc(u.name)} <button class="danger" onclick="adminCancel('${s.id}','${u.id}')">Quitar</button>`:''}).join('<br>')||'Sin inscritos'}</p></details></article>`).join('')||'<div class="empty">No hay entrenamientos.</div>'}`}
function addSession(e){e.preventDefault();let s={id:'s'+Date.now(),date:document.getElementById('sdate').value,time:document.getElementById('stime').value,duration:+document.getElementById('sduration').value,capacity:+document.getElementById('scapacity').value,published:document.getElementById('spublished').checked};db.sessions.push(s);save();render()}
function togglePublish(id){let s=db.sessions.find(s=>s.id===id);s.published=!s.published;save();render()}function publishAll(){db.sessions.filter(s=>!s.published).forEach(s=>s.published=true);save();render()}function editSession(id){let s=db.sessions.find(s=>s.id===id),v=prompt('Nueva fecha (AAAA-MM-DD)',s.date);if(v===null)return;if(!/^\d{4}-\d\d-\d\d$/.test(v)||Number.isNaN(dateObj(v).getTime()))return alert('Fecha no válida');let t=prompt('Nueva hora (HH:MM)',s.time);if(t===null)return;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(t))return alert('Hora no válida');let c=prompt('Número máximo de plazas',s.capacity);if(c===null)return;let cap=+c;if(!Number.isInteger(cap)||cap<count(id)||cap<1)return alert('El límite no puede ser inferior a los inscritos');s.date=v;s.time=t;s.capacity=cap;save();render()}function deleteSession(id){if(!confirm('¿Eliminar entrenamiento y todas sus reservas?'))return;db.sessions=db.sessions.filter(s=>s.id!==id);db.bookings=db.bookings.filter(b=>b.sessionId!==id);save();render()}function adminCancel(id,uid){if(!confirm('¿Quitar esta reserva?'))return;db.bookings=db.bookings.filter(b=>!(b.sessionId===id&&b.userId===uid));save();render()}
function adminSwimmers(){return `<div class="card"><h2>Añadir nadador</h2><form onsubmit="addSwimmer(event)"><label>Nombre completo</label><input id="uname" required><label>Código de cuatro cifras</label><input id="upin" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required><button class="primary full">Dar de alta</button></form></div><h2>Nadadores (${db.swimmers.length})</h2>${db.swimmers.map(u=>`<div class="card row"><div><strong>${esc(u.name)}</strong><div class="muted small">${db.bookings.filter(b=>b.userId===u.id).length} reservas</div></div><button class="danger" onclick="removeSwimmer('${u.id}')">Dar de baja</button></div>`).join('')}`}
function addSwimmer(e){e.preventDefault();let name=document.getElementById('uname').value.trim(),pin=document.getElementById('upin').value;if(db.swimmers.some(u=>u.name.toLowerCase()===name.toLowerCase()))return alert('Ya existe un nadador con ese nombre');db.swimmers.push({id:'u'+Date.now(),name,pin});save();render()}function removeSwimmer(id){if(!confirm('¿Dar de baja al nadador y borrar sus reservas?'))return;db.swimmers=db.swimmers.filter(u=>u.id!==id);db.bookings=db.bookings.filter(b=>b.userId!==id);save();render()}
function adminAdmins(){return `<div class="card"><h2>Añadir administrador</h2><form onsubmit="addAdmin(event)"><label>Nombre</label><input id="aname" required><label>Contraseña</label><input id="apass" type="password" minlength="8" required><button class="primary full">Crear administrador</button></form></div><h2>Administradores</h2>${db.admins.map(a=>`<div class="card row"><strong>${esc(a.name)}</strong><button class="danger" ${db.admins.length===1||a.id===user.id?'disabled':''} onclick="removeAdmin('${a.id}')">Eliminar</button></div>`).join('')}`}
function addAdmin(e){e.preventDefault();let name=document.getElementById('aname').value.trim(),password=document.getElementById('apass').value;if(db.admins.some(a=>a.name.toLowerCase()===name.toLowerCase()))return alert('Ese nombre ya existe');db.admins.push({id:'a'+Date.now(),name,password});save();render()}function removeAdmin(id){if(!confirm('¿Eliminar administrador?'))return;db.admins=db.admins.filter(a=>a.id!==id);save();render()}render();
</script></body></html>
